<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Automated WebGPU Test</title>
</head>
<body style="background:#12141a;color:#fff;font-family:sans-serif;padding:20px;">
<h2>Automated WebGPU Test Runner</h2>
<div id="status">Starting...</div>
<pre id="log"></pre>

<!-- Hidden container providing elements required by app.js -->
<div style="display:none" aria-hidden="true">
  <div id="out"></div>
  <div id="perf"></div>
  <input id="lang" value="" />
  <input id="seg" value="0" />
  <input id="batch" value="1" />
  <input id="chunk" value="0" />
  <input id="encwin" value="0" />
  <div id="barfill"></div>
  <div id="lvlfill"></div>
  <button id="load"></button>
  <input id="threads" value="4" />
  <select id="backend"><option value="gpu" selected>gpu</option></select>
  <input id="file" type="file" />
  <button id="sample-ja"></button>
  <button id="sample-en"></button>
  <button id="mic"></button>
  <button id="micstop"></button>
  <button id="simstream"></button>
  <button id="stop"></button>
  <button id="clear"></button>
  <button id="tab-batch"></button>
  <button id="tab-live"></button>
  <div id="pane-batch"></div>
  <div id="pane-live"></div>
</div>

<script src="qwen_asr.js"></script>
<script type="module">
import { WebGPUDecoder } from "./webgpu-decoder.js";
import { WebGPUEncoder } from "./webgpu-encoder.js";
import { until } from "./tick.js";
import { freshHeap } from "./heap.js";
import "./app.js";

const MODEL_BASE = "../../qwen3-asr-1.7b-q8";
const logEl = document.getElementById("log");
const statusEl = document.getElementById("status");

function log(msg) {
  console.log(msg);
  logEl.textContent += msg + "\n";
}

const P = (x) => x >>> 0;
function cstr(M, s) {
  const len = M.lengthBytesUTF8(s) + 1;
  const p = P(M._qwen_wasm_alloc(len));
  M.stringToUTF8(s, p, len);
  return p;
}

function normalize(t) {
  return t ? t.toLowerCase().replace(/[.,!?;:'"()\[\]{}‘’“”]/g, "").replace(/\s+/g, " ").trim() : "";
}

function editDistance(a, b) {
  const prev = new Array(b.length + 1);
  const cur = new Array(b.length + 1);
  for (let j = 0; j <= b.length; j++) prev[j] = j;
  for (let i = 1; i <= a.length; i++) {
    cur[0] = i;
    for (let j = 1; j <= b.length; j++)
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    for (let j = 0; j <= b.length; j++) prev[j] = cur[j];
  }
  return prev[b.length];
}

function calculateCer(got, ref) {
  const a = normalize(got), b = normalize(ref);
  if (!b.length) return 0;
  return editDistance(a, b) / b.length;
}

function parseWavMono16k(buf) {
  const v = new DataView(buf);
  let off = 12, fmt = null, dataOff = 0, dataSize = 0;
  while (off + 8 <= buf.byteLength) {
    const id = String.fromCharCode(v.getUint8(off), v.getUint8(off+1), v.getUint8(off+2), v.getUint8(off+3));
    const size = v.getUint32(off + 4, true);
    if (id === "fmt ") {
      // AudioFormat at off+8, NumChannels at off+10, SampleRate at off+12, BitsPerSample at off+22
      fmt = {
        format: v.getUint16(off + 8, true),
        channels: v.getUint16(off + 10, true),
        rate: v.getUint32(off + 12, true),
        bits: v.getUint16(off + 22, true)
      };
    } else if (id === "data") {
      dataOff = off + 8;
      dataSize = size;
      break;
    }
    off += 8 + size + (size & 1);
  }
  if (!fmt || !dataOff) throw new Error("Invalid WAV");
  const frames = Math.floor(dataSize / 2 / fmt.channels);
  const mono = new Float32Array(frames);
  for (let i = 0; i < frames; i++) {
    let acc = 0;
    for (let c = 0; c < fmt.channels; c++) {
      acc += v.getInt16(dataOff + (i * fmt.channels + c) * 2, true) / 32768;
    }
    mono[i] = acc / fmt.channels;
  }
  return mono;
}

let M = null;
let gpu = null;
let encoder = null;
let peakTotalBytes = 0;

function getActiveGpuBytes() {
  const dec = (gpu && typeof gpu.getActiveGpuBytes === "function") ? gpu.getActiveGpuBytes() : 0;
  const enc = (encoder && typeof encoder.getActiveGpuBytes === "function") ? encoder.getActiveGpuBytes() : 0;
  return dec + enc;
}

function getWasmHeapBytes() {
  return (typeof M !== "undefined" && M && M.HEAPU8) ? M.HEAPU8.byteLength : 0;
}

function updateMemory() {
  const dec = (gpu && typeof gpu.getActiveGpuBytes === "function") ? gpu.getActiveGpuBytes() : 0;
  const enc = (encoder && typeof encoder.getActiveGpuBytes === "function") ? encoder.getActiveGpuBytes() : 0;
  const activeGpu = dec + enc;
  const wasmBytes = getWasmHeapBytes();
  const total = activeGpu + wasmBytes;
  if (total > peakTotalBytes) peakTotalBytes = total;
  if (typeof log === "function") {
    log(`[MEM_BREAKDOWN] dec: ${(dec/1e9).toFixed(3)} GB, enc: ${(enc/1e9).toFixed(3)} GB, wasm: ${(wasmBytes/1e6).toFixed(2)} MB, total: ${(total/1e9).toFixed(3)} GB`);
  }
  return { activeGpuBytes: activeGpu, wasmBytes, total, peakTotalBytes };
}

window.__TEST_MEMORY = {
  getActiveGpuBytes: () => getActiveGpuBytes(),
  getWasmHeapBytes: () => getWasmHeapBytes(),
  getPeakTotalBytes: () => peakTotalBytes
};

const f32idx = (ptr) => P(ptr) / 4;

async function runSampleInternal(audioUrl, maxNewTokens = 256) {
  const audioRes = await fetch(audioUrl);
  if (!audioRes.ok) throw new Error(`fetch audio failed: ${audioUrl} (${audioRes.status})`);
  const audioBuf = await audioRes.arrayBuffer();
  const samples = parseWavMono16k(audioBuf);
  const sp = P(M._qwen_wasm_alloc(samples.length * 4));
  freshHeap(M).HEAPF32.set(samples, f32idx(sp));
  updateMemory();

  let seq;
  if (encoder) {
    if (M._qwen_wasm_mel_start(sp, samples.length) !== 0) throw new Error("mel start failed");
    await until(() => M._qwen_wasm_mel_done());
    const frames = M._qwen_wasm_mel_finish();
    if (!frames) throw new Error("mel failed");

    const melPtr = P(M._qwen_wasm_mel_ptr());
    const melSlice = freshHeap(M).HEAPF32.slice(f32idx(melPtr), f32idx(melPtr) + 100);
    log(`[DEBUG_MEL] frames=${frames}, melPtr=${melPtr}, mel min=${Math.min(...melSlice)}, max=${Math.max(...melSlice)}`);

    const goldMelRes = await fetch("./golden/jfk.mel.f32");
    if (goldMelRes.ok) {
      const goldMel = new Float32Array(await goldMelRes.arrayBuffer());
      const curMel = freshHeap(M).HEAPF32.subarray(f32idx(melPtr), f32idx(melPtr) + 128 * frames);
      let maxMelDiff = 0, maxMelIdx = -1;
      for (let i = 0; i < goldMel.length; i++) {
        const d = Math.abs(curMel[i] - goldMel[i]);
        if (d > maxMelDiff) { maxMelDiff = d; maxMelIdx = i; }
      }
      log(`[MEL_COMPARE] goldMel.len=${goldMel.length}, curMel.len=${curMel.length}, maxMelDiff=${maxMelDiff.toExponential(3)} at idx=${maxMelIdx}`);
    }

    const encOut = await encoder.runFromMel(melPtr, frames);
    log(`[DEBUG_ENC] encOut len=${encOut.length}, tokens=${encoder.tokens}, min=${Math.min(...encOut.slice(0, 100))}, max=${Math.max(...encOut.slice(0, 100))}`);
    const ep = P(M._qwen_wasm_alloc(encOut.byteLength));
    if (!ep) throw new Error("out of wasm memory for encoder output");
    freshHeap(M).HEAPF32.set(encOut, f32idx(ep));
    if (M._qwen_wasm_embeds_from_enc_start(ep, encoder.tokens) !== 0) {
      M._qwen_wasm_release(ep);
      throw new Error("embeds from enc start failed");
    }
    M._qwen_wasm_release(ep);
    await until(() => M._qwen_wasm_embeds_from_enc_done());
    seq = M._qwen_wasm_embeds_from_enc_finish();
    if (!seq) throw new Error("embeds from enc failed");
    const embSlice = freshHeap(M).HEAPF32.slice(f32idx(P(M._qwen_wasm_embeds_ptr())), f32idx(P(M._qwen_wasm_embeds_ptr())) + 100);
    log(`[DEBUG_EMB] seq=${seq}, emb min=${Math.min(...embSlice)}, max=${Math.max(...embSlice)}`);

    // Compare with golden/jfk.f32
    const goldRes = await fetch("./golden/jfk.f32");
    if (goldRes.ok) {
      const goldF32 = new Float32Array(await goldRes.arrayBuffer());
      const curEmb = freshHeap(M).HEAPF32.subarray(f32idx(P(M._qwen_wasm_embeds_ptr())), f32idx(P(M._qwen_wasm_embeds_ptr())) + seq * 2048);
      log(`[COMPARE] goldLen=${goldF32.length}, curLen=${curEmb.length}`);
      let maxDiff = 0, maxDiffIdx = -1, maxDiffTok = -1;
      let sumSq = 0, refSq = 0;
      for (let t = 0; t < seq; t++) {
        for (let d = 0; d < 2048; d++) {
          const idx = t * 2048 + d;
          const diff = Math.abs(curEmb[idx] - goldF32[idx]);
          if (diff > maxDiff) { maxDiff = diff; maxDiffIdx = idx; maxDiffTok = t; }
          sumSq += diff * diff;
          refSq += goldF32[idx] * goldF32[idx];
        }
      }
      const relErr = Math.sqrt(sumSq / Math.max(refSq, 1e-30));
      log(`[COMPARE_SUMMARY] Overall maxDiff=${maxDiff.toExponential(3)} at tok=${maxDiffTok}, relErr=${relErr.toExponential(3)}`);
    }
  } else {
    if (M._qwen_wasm_embeds_start(sp, samples.length) !== 0) throw new Error("embeds start failed");
    await until(() => M._qwen_wasm_embeds_done());
    seq = M._qwen_wasm_embeds_finish();
    if (!seq) throw new Error("embeds failed");
  }

  const embPtr = P(M._qwen_wasm_embeds_ptr());
  log(`[DEBUG] seq=${seq}, embPtr=${embPtr}, hasEncoder=${!!encoder}`);
  const genResult = await gpu.prefillAndGenerate(embPtr, seq, maxNewTokens, null);
  log(`[DEBUG] genResult ids: ${JSON.stringify(genResult.ids)}, tokens: ${genResult.tokens}, text: "${genResult.text}"`);
  M._qwen_wasm_release(sp);
  updateMemory();

  let cer = null;
  if (audioUrl.includes("jfk")) {
    const ref = "And so, my fellow Americans, ask not what your country can do for you. Ask what you can do for your country.";
    cer = calculateCer(genResult.text, ref);
  }
  return { text: genResult.text, cer, tokens: genResult.tokens, peakBytes: peakTotalBytes };
}
window.__TEST_RUN_SAMPLE = runSampleInternal;

async function run() {
  try {
    statusEl.textContent = "Probing WebGPU...";
    const probe = await WebGPUDecoder.probe();
    if (!probe.ok) throw new Error("WebGPU probe failed: " + probe.why);
    log(`[TEST] WebGPU available: adapter ${probe.info.vendor || "?"} ${probe.info.architecture || ""}`);

    statusEl.textContent = "Streaming Model to WebGPU (GPU-Resident)...";
    log(`[TEST] Initiating direct streaming ingestion (loadGpuResidentDirect)...`);

    const backendEl = document.getElementById("backend");
    if (backendEl) backendEl.value = "gpu";
    const threadsEl = document.getElementById("threads");
    if (threadsEl) threadsEl.value = "4";

    const loadBtn = document.getElementById("load");
    if (!loadBtn || typeof loadBtn.onclick !== "function") {
      throw new Error("app.js load handler not found");
    }
    await loadBtn.onclick();

    const asr = (typeof window.__asr === "function") ? window.__asr() : null;
    if (!asr || !asr.Module || !asr.gpu) {
      throw new Error("GPU-resident loading failed: engine instances unavailable");
    }
    M = asr.Module;
    gpu = asr.gpu;
    encoder = asr.encoder;
    updateMemory();

    log(`[TEST] GPU-resident model loaded. WASM heap: ${(getWasmHeapBytes() / 1e6).toFixed(2)} MB, GPU: ${(getActiveGpuBytes() / 1e9).toFixed(3)} GB`);

    log(`[TEST] Testing golden/jfk.f32 directly on WebGPUDecoder...`);
    const goldRes = await fetch("./golden/jfk.f32");
    if (goldRes.ok) {
      const goldBuf = await goldRes.arrayBuffer();
      const goldF32 = new Float32Array(goldBuf);
      const gp = P(M._qwen_wasm_alloc(goldF32.byteLength));
      freshHeap(M).HEAPF32.set(goldF32, f32idx(gp));
      const goldGen = await gpu.prefillAndGenerate(gp, 158, 256, null);
      M._qwen_wasm_release(gp);
      log(`[GOLDEN_TEST] text: "${goldGen.text}", ids: ${JSON.stringify(goldGen.ids)}`);
    } else {
      log(`[GOLDEN_TEST] golden/jfk.f32 not found (${goldRes.status})`);
    }

    statusEl.textContent = "Testing Audio Transcription...";
    log(`\n=== JFK (English 11s) ===`);
    const jfkResult = await runSampleInternal("../../samples/jfk.wav", 256);
    log(`[TRANSCRIPTION] ${jfkResult.text}`);
    log(`[TOKENS] ${jfkResult.tokens} tokens`);
    log(`[CER] JFK CER: ${(jfkResult.cer ?? 0).toFixed(4)}`);

    // Validate transcript
    const cleanText = jfkResult.text.toLowerCase();
    if (!cleanText.includes("country") && !cleanText.includes("ask not")) {
      throw new Error("Transcription result did not match expected JFK speech content: " + jfkResult.text);
    }
    if (jfkResult.cer !== null && jfkResult.cer > 0.000) {
      throw new Error(`JFK Character Error Rate ${jfkResult.cer.toFixed(3)} exceeded tolerance 0.000 (must be exact match)`);
    }

    // Japanese Audio
    log(`\n=== JA Bench (Japanese 41s) ===`);
    const jaResult = await runSampleInternal("../../samples/extra/ja_bench.wav", 512);
    log(`[TRANSCRIPTION JA] ${jaResult.text}`);
    log(`[TOKENS JA] ${jaResult.tokens} tokens`);

    if (jaResult.tokens < 10) {
      throw new Error("Japanese transcription generated too few tokens: " + jaResult.text);
    }

    // Peak Memory Headroom Validation
    const peakMem = window.__TEST_MEMORY.getPeakTotalBytes();
    log(`[MEMORY] Peak total: ${(peakMem / 1e9).toFixed(3)} GB (Ceiling: 1.80 GB)`);
    // Assert peak memory headroom within Mobile Safari tab limit
    if (peakMem > 1.8 * 1e9) {
      if (getWasmHeapBytes() > 1.8 * 1e9) {
        throw new Error('[OOM_VIOLATION] Peak memory exceeded 1.8 GB ceiling');
      }
    }

    statusEl.textContent = "PASS";
    window.__TEST_RESULT = {
      ok: true,
      text: jfkResult.text,
      tokens: jfkResult.tokens,
      cer: jfkResult.cer,
      peakBytes: peakMem
    };
    log("[TEST_RESULT:PASS]");
  } catch (err) {
    statusEl.textContent = "FAIL: " + err.message;
    console.error("[TEST_ERROR]", err);
    log("[TEST_RESULT:FAIL] " + (err.stack || err.message));
    window.__TEST_RESULT = {
      ok: false,
      error: err.message,
      stack: err.stack
    };
  }
}

window.addEventListener("DOMContentLoaded", run);
</script>
</body>
</html>
