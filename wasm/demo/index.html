<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Qwen3-ASR — WebAssembly demo</title>
<style>
  :root {
    --bg: #12141a; --panel: #1b1e26; --line: #2c3040;
    --fg: #e6e8ef; --dim: #9aa1b4; --accent: #6ea8fe; --ok: #5cd6a0; --warn: #f0a35e;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
  }
  * { box-sizing: border-box; }
  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  body {
    margin: 0;
    padding-top: max(16px, env(safe-area-inset-top, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg); color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--dim); margin-bottom: 20px; font-size: 14px; }
  .wrap { max-width: 980px; margin: 0 auto; width: 100%; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px; margin-bottom: 16px;
  }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  button {
    background: var(--accent); color: #101218; border: 0; border-radius: 8px;
    padding: 11px 18px; font-weight: 600; font-size: 16px; cursor: pointer;
    min-height: 44px; min-width: 44px;
    display: inline-flex; align-items: center; justify-content: center;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    transition: background 0.15s ease, opacity 0.15s ease, transform 0.1s ease;
  }
  button:active:not(:disabled) { transform: scale(0.98); opacity: 0.9; }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  button.ghost:active:not(:disabled) { background: rgba(255, 255, 255, 0.06); }
  button:disabled { opacity: .45; cursor: default; }
  label { color: var(--dim); font-size: 16px; min-height: 44px; display: inline-flex; align-items: center; gap: 8px; touch-action: manipulation; cursor: pointer; }
  select, input[type=number], input[type=file] {
    background: #14171f; color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; font-size: 16px;
    min-height: 44px; min-width: 44px; box-sizing: border-box; touch-action: manipulation;
  }
  select { cursor: pointer; }
  input[type=file] {
    padding: 6px 10px;
    max-width: 100%;
  }
  input[type=file]::file-selector-button {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 10px 16px; font-size: 16px; font-weight: 500;
    margin-right: 12px; cursor: pointer; min-height: 44px; min-width: 44px;
    touch-action: manipulation;
  }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs button {
    flex: 1; min-height: 44px; padding: 10px 16px; font-size: 16px; font-weight: 500;
    background: transparent; border: 1px solid var(--line); color: var(--dim);
    border-radius: 8px; text-align: center;
  }
  .tabs button.on {
    background: var(--panel); color: var(--fg); border-color: var(--accent);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
  }
  #out {
    white-space: pre-wrap; word-break: break-word; min-height: 120px; max-height: 450px;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: #0e1015; border: 1px solid var(--line); border-radius: 10px;
    padding: 16px; font-size: 16px; line-height: 1.6;
  }
  .stat { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 14px; }
  .stat b { color: var(--fg); font-weight: 600; }
  #bar { height: 8px; background: #0e1015; border-radius: 4px; overflow: hidden; margin-top: 10px; }
  #barfill { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .log {
    color: var(--dim); font-size: 12px; max-height: 120px; overflow: auto;
    margin-top: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    -webkit-overflow-scrolling: touch;
  }
  .err { color: var(--warn); }
  .lvl { height: 8px; background: #0e1015; border-radius: 4px; overflow: hidden; flex: 1; min-width: 120px; }
  .lvl > div { height: 100%; width: 0; background: var(--ok); }
  .hide { display: none; }
  /* The stream's guess for audio it has not committed yet: shown so text
     appears as soon as the engine has any, and rewritten as it firms up. */
  .partial { opacity: .45; font-style: italic; }

  /* Recording state feedback */
  #micstop:not(.hide) {
    background: #dc3545; color: #fff; border: 1px solid #e04555;
    animation: pulse-recording 2s infinite;
  }
  @keyframes pulse-recording {
    0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.5); }
    70% { box-shadow: 0 0 0 8px rgba(220, 53, 69, 0); }
    100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
  }

  /* Responsive card styling for iPhone 16 Pro Max (440x956 pt) & mobile devices */
  @media (max-width: 640px) {
    body {
      padding-top: max(16px, env(safe-area-inset-top, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
      padding-left: max(16px, env(safe-area-inset-left, 0px));
    }
    h1 { font-size: 20px; }
    .sub { font-size: 13px; margin-bottom: 14px; }
    .panel {
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 12px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: stretch;
    }
    .row > button {
      width: 100%;
      min-height: 48px;
    }
    #sample-ja, #sample-en {
      flex: 1 1 calc(50% - 6px);
      min-width: 140px;
    }
    .row > label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 44px;
      gap: 8px;
      font-size: 16px;
    }
    .row > label select {
      flex: 1;
      max-width: 60%;
      min-height: 44px;
      font-size: 16px;
    }
    .row > label input[type=number] {
      min-height: 44px;
      font-size: 16px;
      text-align: center;
    }
    .row > input[type=file] {
      width: 100%;
      min-height: 44px;
    }
    .row > .stat {
      width: 100%;
      text-align: center;
      font-size: 13px;
    }
    .lvl {
      width: 100%;
      min-width: 100%;
      height: 10px;
      margin: 4px 0;
    }
    #mic, #micstop {
      min-height: 52px;
      font-size: 17px;
    }
    #out {
      min-height: 140px;
      max-height: 320px;
      font-size: 16px;
      padding: 14px;
    }
  }

  /* Compact landscape mode for mobile devices */
  @media (max-height: 500px) and (orientation: landscape) {
    body {
      padding-top: max(8px, env(safe-area-inset-top, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
      padding-left: max(16px, env(safe-area-inset-left, 0px));
    }
    .panel {
      padding: 10px;
      margin-bottom: 8px;
    }
    #out {
      min-height: 80px;
      max-height: 160px;
    }
    .log {
      max-height: 70px;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Qwen3-ASR — WebAssembly</h1>
  <div class="sub">Pure C inference engine compiled to wasm. Runs entirely in this tab; no audio leaves the machine.</div>

  <div class="panel">
    <div class="row">
      <button id="load">Load model</button>
      <label>model
        <select id="model-select">
          <option value="0.6b">0.6B (Mobile-safe, 0.84 GB)</option>
          <option value="1.7b">1.7B (2.18 GB)</option>
        </select>
      </label>
      <label>threads <input id="threads" type="number" min="1" max="12" value="8" style="width:64px"></label>
      <label>decoder
        <select id="backend">
          <option value="gpu" selected>GPU (WebGPU)</option>
          <option value="cpu">CPU (wasm)</option>
        </select>
      </label>
      <label>language
        <select id="lang">
          <option value="">auto</option>
          <option value="Japanese" selected>Japanese</option>
          <option value="English">English</option>
        </select>
      </label>
      <span id="status" class="stat">idle</span>
    </div>
    <div id="bar"><div id="barfill"></div></div>
    <div id="log" class="log"></div>
  </div>

  <div class="tabs">
    <button id="tab-batch" class="on">Batch (audio file)</button>
    <button id="tab-live">Streaming (microphone)</button>
  </div>

  <div class="panel" id="pane-batch">
    <div class="row">
      <input id="file" type="file" accept="audio/*" disabled>
      <button id="sample-ja" class="ghost" disabled>sample: 日本語 41s</button>
      <button id="sample-en" class="ghost" disabled>sample: JFK 11s</button>
      <label>segment <input id="seg" type="number" min="0" max="60" step="5" value="0" style="width:64px"> s</label>
      <label>batch <input id="batch" type="number" min="1" max="16" value="4" style="width:52px"></label>
      <span class="stat">(0 = decode the whole file in one pass)</span>
    </div>
  </div>

  <div class="panel hide" id="pane-live">
    <div class="row">
      <button id="mic" disabled>Start microphone</button>
      <button id="micstop" class="ghost hide">Stop</button>
      <button id="simstream" class="ghost" disabled>Stream sample file (no mic)</button>
      <label>chunk <input id="chunk" type="number" min="1" max="8" step="0.5" value="2" style="width:64px"> s</label>
      <label>enc window <input id="encwin" type="number" min="1" max="8" step="1" value="4" style="width:64px"> s</label>
      <div class="lvl"><div id="lvlfill"></div></div>
    </div>
  </div>

  <div class="panel">
    <div id="out"></div>
    <div class="row" style="margin-top:10px">
      <span id="perf" class="stat"></span>
    </div>
  </div>
</div>

<script src="coi-serviceworker.js"></script>
<script src="playground-config.js"></script>
<script src="qwen_asr.js"></script>
<script src="app.js" type="module"></script>
</body>
</html>
